site_name: 鸿道机器人操作系统公开知识库
site_description: 鸿道机器人操作系统相关的场景、产品、技术与发展过程
site_author: Intewell
site_url: https://mindofcx.github.io/Intewell-robot-os-product-definition/

repo_name: mindofcx/Intewell-robot-os-product-definition
repo_url: https://github.com/mindofcx/Intewell-robot-os-product-definition
edit_uri: edit/main/docs/

theme:
  name: material
  language: zh
  font: false
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

plugins:
  - search:
      lang:
        - zh
        - en

nav:
  - 首页: index.md
  - 入门与架构:
      - 机器人场景入门: 01-机器人场景入门.md
      - 操作系统、ROS 与中间件是什么: 02-操作系统-ROS与中间件是什么.md
      - 鸿道机器人操作系统介绍: 03-鸿道机器人操作系统介绍.md
      - 鸿道三域融合架构: 04-鸿道三域融合架构.md
  - 通信与智能:
      - 机器人中间件与通信: 05-机器人中间件与通信.md
      - Agent 与鸿道机器人操作系统: 06-Agent与鸿道机器人操作系统.md
  - 产品与行业:
      - 鸿道机器人操作系统的发展过程: 07-鸿道机器人操作系统的发展过程.md
      - 行业技术路线与代表产品: 08-行业技术路线与代表产品.md
  - 术语与资料:
      - 术语表与常见问题: 99-术语表与常见问题.md

extra:
  generator: false

copyright: 文档状态：第一版草稿，内容不代替正式产品规格、版本说明或测试报告。
